version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: customer_inquiry_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-customer_inquiries}
    ports:
      # If host port 5432 is used by a local service, set DOCKER_DB_PORT=5433 in .env
      - "${DOCKER_DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-customer_inquiries}"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data

  flyway:
    image: flyway/flyway:latest
    container_name: customer_inquiry_flyway
    depends_on:
      postgres:
        condition: service_healthy
    command: -url=jdbc:postgresql://postgres:5432/${DB_NAME:-customer_inquiries} -user=${DB_USER:-postgres} -password=${DB_PASSWORD:-postgres} -connectRetries=10 migrate
    volumes:
      - ./backend/migrations:/flyway/sql

volumes:
  postgres_data:
